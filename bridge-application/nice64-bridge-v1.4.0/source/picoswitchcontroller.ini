[Timing]
GamepadPollIntervalMs=2
SerialWriterWaitMs=0
MinimumPressDurationMs=0

[Serial]
BaudRate=115200

[BrowserLive]
; AUTO tries local in-process readability, then the existing Direct converter.
; FROGFIND remains available only when explicitly selected for diagnostics.
ReadableSourceMode=AUTO
; browser://search replaces {query} with URL-encoded keyboard text.
SearchProviderName=Brave Search
SearchProviderUrl=https://search.brave.com/search?q={query}
